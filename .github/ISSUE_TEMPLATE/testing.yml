name: Testing contribution
description: Propose unit tests, integration tests, fixtures, or CI coverage work.
title: "[Testing] "
labels:
  - testing
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        ### HackRadar Contribution Rule

        ⭐ Before contributing, please star the HackRadar repository.

        For pull requests:
        - A repository star is required before the PR can proceed.
        - If the PR is blocked by the `star-required` check, star the repository.
        - After starring, PUSH A NEW COMMIT to your PR branch so GitHub Actions can verify the star and unblock the PR.

        Please read `CONTRIBUTING.md` before opening a PR.
  - type: markdown
    attributes:
      value: |
        <!-- hackradar-track: testing -->
        <!-- hackradar-kind: contribution -->
        Use this form for test coverage, fixtures, and CI reliability work.
  - type: input
    id: contributor_name
    attributes:
      label: Contributor name
      placeholder: Your name or preferred display name
    validations:
      required: true
  - type: input
    id: github_username
    attributes:
      label: GitHub username
      placeholder: your-handle
    validations:
      required: true
  - type: textarea
    id: work_item
    attributes:
      label: What do you want to work on?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why do you want to work on it?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Relevant skills or experience
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Expected scope
      options:
        - Small
        - Medium
        - Larger
    validations:
      required: true
  - type: dropdown
    id: suggested_difficulty
    attributes:
      label: Suggested difficulty
      description: Maintainers will set the authoritative difficulty label before points are awarded.
      options:
        - Easy
        - Medium
        - Hard
        - Expert
    validations:
      required: true
  - type: dropdown
    id: fellowship
    attributes:
      label: Are you completing this contribution as part of the HackRadar Fellowship?
      options:
        - Yes
        - No
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Relevant links
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched for duplicate issues.
          required: true
        - label: I understand the contribution guidelines in CONTRIBUTING.md.
          required: true
