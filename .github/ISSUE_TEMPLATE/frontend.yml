name: Frontend contribution
description: Propose UI, interaction, or accessibility work in the React app.
title: "[Frontend] "
labels:
  - frontend
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        <!-- hackradar-track: frontend -->
        <!-- hackradar-kind: contribution -->
        Use this form for frontend, interface, and user experience work in HackRadar.
  - type: input
    id: contributor_name
    attributes:
      label: Contributor name
      description: What name should we use when discussing this contribution?
      placeholder: Your name or preferred display name
    validations:
      required: true
  - type: input
    id: github_username
    attributes:
      label: GitHub username
      description: Your GitHub handle for assignment and follow-up.
      placeholder: your-handle
    validations:
      required: true
  - type: textarea
    id: work_item
    attributes:
      label: What do you want to work on?
      description: Be specific about the UI, flow, or page you want to improve.
      placeholder: Describe the feature, page, or component.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why do you want to work on it?
      description: Tell us why this matters to you or to the project.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Share the plan you would like to follow.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Relevant skills or experience
      description: Mention any frontend, design, accessibility, or testing experience that helps us route the issue.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Expected scope
      options:
        - Small
        - Medium
        - Larger
    validations:
      required: true
  - type: dropdown
    id: suggested_difficulty
    attributes:
      label: Suggested difficulty
      description: Maintainers will set the authoritative difficulty label before points are awarded.
      options:
        - Easy
        - Medium
        - Hard
        - Expert
    validations:
      required: true
  - type: dropdown
    id: fellowship
    attributes:
      label: Are you completing this contribution as part of the HackRadar Fellowship?
      options:
        - Yes
        - No
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Relevant links
      description: Add mockups, references, related issues, or any other useful links.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched for duplicate issues.
          required: true
        - label: I understand the contribution guidelines in CONTRIBUTING.md.
          required: true
