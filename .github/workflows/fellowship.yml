name: Fellowship Contribution Recording

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: fellowship-record-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  record:
    name: Record merged Fellowship contributions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record merged contribution
        run: node scripts/hackradar-contributor-automation.mjs record-fellowship
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          HACKRADAR_BACKEND_URL: ${{ secrets.HACKRADAR_BACKEND_URL }}
          HACKRADAR_INTERNAL_SECRET: ${{ secrets.HACKRADAR_INTERNAL_SECRET }}
