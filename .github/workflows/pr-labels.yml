name: PR Label Inheritance

# Label inheritance writes labels, and GitHub only grants a write token to the
# base repository context. A `pull_request` run from a fork receives a read-only
# token and fails with "403 Resource not accessible by integration", so this uses
# `pull_request_target` to run trusted base-branch code with the required scope.
# Never check out or execute the pull request head with this token.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inherit:
    name: Copy inheritable labels from linked issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure canonical labels exist
        run: node scripts/hackradar-contributor-automation.mjs ensure-labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Inherit labels
        run: node scripts/hackradar-contributor-automation.mjs pr-labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
